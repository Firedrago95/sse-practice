plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Web 스타터: 웹 애플리케이션(REST API, MVC) 개발에 필요한 모든 것을 포함합니다.
    // 내장 톰캣 서버가 포함되어 있어 SSE 구현에 필수적입니다.
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot DevTools: 개발 편의를 위한 도구입니다.
    // 코드가 변경되면 애플리케이션을 자동으로 재시작해줍니다.
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Spring Boot Test 스타터: JUnit 5, Mockito 등 테스트에 필요한 라이브러리를 포함합니다.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 스프링 데이터 jpa 사용
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // H2 데이터베이스 드라이버: 별도의 DB 설치 없이 사용할 수 있는 인메모리 데이터베이스
    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}
